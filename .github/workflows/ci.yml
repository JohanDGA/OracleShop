name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @oraculo/validations test

  db:
    name: Supabase RLS tests
    runs-on: ubuntu-latest
    # El proveedor Google en config.toml lee credenciales por env(). En CI no se
    # prueba OAuth, pero TODOS los comandos de supabase (start, status -o json
    # invocado por los tests, y stop) re-evalúan config.toml, así que las
    # variables deben existir a nivel de job, no solo en el step de start.
    env:
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: ci-dummy
      SUPABASE_AUTH_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase local
        run: pnpm --filter @oraculo/db exec supabase start
      - name: Run RLS tests
        run: pnpm --filter @oraculo/db test
      - name: Stop Supabase local
        if: always()
        run: pnpm --filter @oraculo/db exec supabase stop
